name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    name: Lint, Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/mobile

      - name: Run Global Lint
        run: npm run lint

      - name: Mobile Typecheck
        run: cd apps/mobile && ./node_modules/.bin/tsc --noEmit

      - name: Build Web Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_ci_build
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key_for_ci_build
        run: npm run build:web
